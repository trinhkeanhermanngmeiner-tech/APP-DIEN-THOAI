<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ Tay Lịch Việt</title>
<meta name="author" content="BS. Trịnh Kế An">
<!-- Sổ Tay Lịch Việt · © 2026 BS. Trịnh Kế An (bstrinhkean@gmail.com). Mọi quyền được bảo lưu. -->
<meta name="theme-color" content="#B3201B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Tay">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<style>
/* Layout: "Sơn mài & trống đồng" — mỗi mục mở đầu bằng một dải màu sơn mài (đỏ son, vàng nghệ, xanh lục bảo, mực tàu)
   in hoa văn mặt trống đồng; nội dung bên dưới là các tấm giấy sáng; thanh tab nổi dạng viên thuốc. */
:root{
  --bg:#EFEFEC; --surface:#FFFFFF; --surface2:#F4F4F1; --ink:#191715; --muted:#6B6762; --line:#E2E0DC;
  --red:#C2261F; --red-soft:#FCE8E6; --gold:#E3AE3F; --gold-ink:#8A5D07; --gold-soft:#FBF1DA; --jade:#13705A; --jade-soft:#DFF1EA;
  --hero:#B3201B; --hero2:#7E120E; --on-hero:#FFF7EE; --hero-muted:rgba(255,247,238,.72);
  --inkcard:#1E1B19; --on-inkcard:#F7F2EA;
  --c1:#C2261F; --c2:#E3AE3F; --c3:#13705A; --c4:#2F5DA8; --c5:#8E44AD; --c6:#D9731A; --c7:#3E8E9E; --c8:#8A8279;
  --n-y:#FFF1BF; --n-r:#FFDCD6; --n-g:#D6F0DF; --n-b:#D8E6FB; --n-v:#E9DDF7;
  --shadow:0 1px 2px rgba(25,20,15,.06),0 8px 24px rgba(25,20,15,.07);
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0E0D; --surface:#1B1918; --surface2:#242120; --ink:#F1ECE6; --muted:#A39C94; --line:#2F2B29;
  --red:#FF6B5E; --red-soft:#3B1C19; --gold:#F0C062; --gold-ink:#F0C062; --gold-soft:#33291A; --jade:#4CC5A2; --jade-soft:#15302A;
  --hero:#9C1A15; --hero2:#5E0D0A; --inkcard:#262220; --on-inkcard:#F7F2EA;
  --c1:#FF6B5E; --c2:#F0C062; --c3:#4CC5A2; --c4:#7EA6EE; --c5:#C08BE0; --c6:#F2994A; --c7:#6FC1CF; --c8:#A39C94;
  --n-y:#3A3218; --n-r:#3E2220; --n-g:#1D3326; --n-b:#1E2A3E; --n-v:#2E2440;
  --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0E0D; --surface:#1B1918; --surface2:#242120; --ink:#F1ECE6; --muted:#A39C94; --line:#2F2B29;
  --red:#FF6B5E; --red-soft:#3B1C19; --gold:#F0C062; --gold-ink:#F0C062; --gold-soft:#33291A; --jade:#4CC5A2; --jade-soft:#15302A;
  --hero:#9C1A15; --hero2:#5E0D0A; --inkcard:#262220; --on-inkcard:#F7F2EA;
  --c1:#FF6B5E; --c2:#F0C062; --c3:#4CC5A2; --c4:#7EA6EE; --c5:#C08BE0; --c6:#F2994A; --c7:#6FC1CF; --c8:#A39C94;
  --n-y:#3A3218; --n-r:#3E2220; --n-g:#1D3326; --n-b:#1E2A3E; --n-v:#2E2440;
  --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark}
/* màu dải đầu theo từng mục */
.app[data-tab="events"]{--hero:#A86A06;--hero2:#6B4103}
.app[data-tab="money"]{--hero:#0E6150;--hero2:#063A30}
.app[data-tab="notes"]{--hero:#2A2623;--hero2:#141210}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:170px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ===== Dải đầu (hero) ===== */
.hero{position:relative;overflow:hidden;color:var(--on-hero);background:linear-gradient(160deg,var(--hero) 0%,var(--hero2) 100%);padding:12px 16px 26px;border-radius:0 0 28px 28px;isolation:isolate}
.hero .drum{position:absolute;width:420px;height:420px;right:-150px;top:-120px;color:var(--gold);opacity:.22;z-index:-1}
@media (prefers-reduced-motion:no-preference){.hero .drum{animation:spin 160s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}
.bar{display:flex;align-items:center;gap:10px;min-height:44px}
.bar h1{flex:1;margin:0;font:800 22px/1.1 var(--f-display);letter-spacing:-.01em}
.mode{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--hero-muted)}
.mode i{width:7px;height:7px;border-radius:50%;background:var(--gold);display:inline-block}
.mode.sync i{background:#7CE0B8}
.hbtn{width:40px;height:40px;border-radius:14px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:var(--on-hero);display:grid;place-items:center;flex:none}
.hbtn svg{width:20px;height:20px}
.hchip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.13);font-size:13px;font-weight:500;color:var(--on-hero)}
.hchip.gold{background:var(--gold);color:#3A2600;font-weight:700}

/* hôm nay */
.today{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin-top:6px}
.today .big{font:800 132px/.86 var(--f-display);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.today .wd{font:700 22px/1.2 var(--f-display);margin-top:8px}
.today .my{color:var(--hero-muted);font-size:14px}
.moonbox{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-bottom:4px}
.moonbox .ld{font:800 40px/1 var(--f-display);color:var(--gold)}
.moonbox .lm{font-size:13px;color:var(--hero-muted);line-height:1.3}
.hchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}

/* điều hướng tháng trong dải đầu */
.mnav{display:flex;align-items:center;gap:10px;margin-top:6px}
.mnav .t{flex:1;text-align:center}
.mnav .t b{display:block;font:800 30px/1.1 var(--f-display);letter-spacing:-.02em}
.mnav .t span{font-size:13px;color:var(--hero-muted)}
.hstat{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-top:14px}
.hstat .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--hero-muted);font-weight:600}
.hstat .val{font:800 34px/1.1 var(--f-display);letter-spacing:-.02em;overflow-wrap:anywhere}
.hstat .sub{display:flex;gap:18px;margin-top:6px;font-size:13px;color:var(--hero-muted);flex-wrap:wrap}
.hstat .sub b{color:var(--on-hero);font-weight:700}
.countdown{display:flex;align-items:flex-end;gap:14px;margin-top:8px}
.countdown .n{font:800 96px/.85 var(--f-display);color:var(--gold);letter-spacing:-.04em}
.countdown .l{padding-bottom:6px;min-width:0}
.countdown .l b{display:block;font:700 19px/1.25 var(--f-display);overflow-wrap:anywhere}
.countdown .l span{font-size:13px;color:var(--hero-muted)}
.hsearch{width:100%;margin-top:12px;border:0;border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.12);color:var(--on-hero)}
.hsearch::placeholder{color:var(--hero-muted)}

/* ===== Thân ===== */
.view{display:flex;flex-direction:column;gap:16px;padding:16px 16px 8px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2{margin:0;font:800 19px/1.2 var(--f-display);letter-spacing:-.01em}
.lnk{border:0;background:none;color:var(--red);font-weight:700;font-size:13px;padding:4px 0}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px}
.empty{padding:18px 6px;text-align:center;color:var(--muted);font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:0}

/* dải tuần */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:-34px;position:relative;z-index:2;padding:0 16px}
.wk{border:0;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px}
.wk .w{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.wk .d{font:800 19px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.wk .l{font-size:10px;color:var(--muted)}
.wk.sun .d{color:var(--red)}
.wk.now{background:var(--ink);color:var(--bg)}
.wk.now .w,.wk.now .l{color:var(--bg);opacity:.75}
.wk.now .d{color:var(--gold)}
.pips{display:flex;gap:2px;height:4px;margin-top:2px}
.pips i{width:4px;height:4px;border-radius:50%;background:var(--jade)}
.pips i.h{background:var(--red)} .pips i.m{background:var(--gold)}

/* thẻ đếm ngược trượt ngang */
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.cd{scroll-snap-align:start;flex:0 0 148px;border:0;text-align:left;border-radius:20px;padding:14px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:168px;color:var(--ink)}
.cd .k{align-self:flex-start;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.cd .n{font:800 46px/.9 var(--f-display);letter-spacing:-.03em;margin-top:auto}
.cd .n small{font:600 13px var(--f-body);letter-spacing:0;margin-left:4px;color:var(--muted)}
.cd .t{font-weight:700;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cd .s{font-size:12px;color:var(--muted)}
.cd.hot{background:var(--red);color:#fff}
.cd.hot .n small,.cd.hot .s{color:rgba(255,255,255,.8)}
.cd.hot .k{background:rgba(255,255,255,.2)!important;color:#fff!important}
.k-birthday{background:var(--jade-soft);color:var(--jade)}
.k-death{background:var(--gold-soft);color:var(--gold-ink)}
.k-anniv{background:var(--red-soft);color:var(--red)}
.k-other,.k-once{background:var(--surface2);color:var(--muted)}
.k-hol{background:var(--red-soft);color:var(--red)}
.k-month{background:var(--gold-soft);color:var(--gold-ink)}

.alert{background:var(--gold-soft);border-radius:20px;padding:14px 16px;display:flex;gap:12px}
.alert svg{width:24px;height:24px;color:var(--gold-ink);flex:none;margin-top:2px}
.alert b{display:block;margin-bottom:2px}
.alert div div{font-size:14px}

/* thẻ tiền tối màu */
.moneycard{background:var(--inkcard);color:var(--on-inkcard);border-radius:22px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:0;text-align:left;width:100%}
.moneycard .lbl{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.moneycard .val{font:800 32px/1.1 var(--f-display);letter-spacing:-.02em;overflow-wrap:anywhere}
.moneycard .sub{font-size:13px;opacity:.75;margin-top:4px}
.ring{width:86px;height:86px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:800 18px var(--f-display)}
.quick,.qadd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa{border:0;border-radius:18px;padding:14px 8px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600}
.qa i{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-style:normal}
.qa svg{width:22px;height:22px}

/* danh sách */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border:0;border-bottom:1px solid var(--line);min-width:0;width:100%;background:none;text-align:left}
.item:last-child{border-bottom:0}
.item .txt{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted)}
.dot{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.badge.today{background:var(--red);color:#fff}
.badge.soon{background:var(--red-soft);color:var(--red)}
.datebox{width:52px;flex:none;text-align:center;border-radius:14px;padding:6px 0}
.datebox b{display:block;font:800 22px/1 var(--f-display)}
.datebox span{font-size:10px;font-weight:700;text-transform:uppercase;opacity:.8}

/* lịch tháng */
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calcard{margin-top:-30px;position:relative;z-index:2;margin-inline:16px;padding:10px}
.grid7 .wh{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:2px 0 6px}
.grid7 .wh.sun{color:var(--red)}
.day{border:0;background:none;border-radius:12px;min-height:56px;padding:5px 0 3px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink)}
.day.out{opacity:.3}
.day .sd{font:800 18px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.day .lu{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:2px}
.day .lu.key{color:var(--gold-ink);font-weight:700}
.day .lu svg{width:9px;height:9px}
.day.sun .sd,.day.off .sd{color:var(--red)}
.day.off{background:var(--red-soft)}
.day.today{background:var(--red)}
.day.today .sd,.day.today .lu{color:#fff}
.day.sel:not(.today){box-shadow:inset 0 0 0 2px var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);padding:0 4px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dayhead{display:flex;gap:14px;align-items:center}
.dayhead .bn{font:800 52px/.9 var(--f-display);letter-spacing:-.03em;color:var(--red)}
.dayhead .tt b{display:block;font:700 17px/1.25 var(--f-display)}
.dayhead .tt span{font-size:13px;color:var(--muted)}

/* chi tiêu */
.catrow{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;font-size:14px;padding:6px 0}
.catrow i{width:12px;height:12px;border-radius:4px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;margin:10px 0 6px}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.neg{color:var(--red)} .amt.pos{color:var(--jade)}
.dayhdr{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:14px 0 2px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}

/* ghi chú */
.notes{columns:2;column-gap:10px}
.note{break-inside:avoid;margin:0 0 10px;width:100%;text-align:left;border:0;background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:block;color:var(--ink)}
.note.c-y{background:var(--n-y)} .note.c-r{background:var(--n-r)} .note.c-g{background:var(--n-g)} .note.c-b{background:var(--n-b)} .note.c-v{background:var(--n-v)}
.note .t{font:700 16px/1.3 var(--f-display);margin-bottom:6px;overflow-wrap:anywhere}
.note .b{font-size:13px;opacity:.8;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical;overflow:hidden}
.note .d{font-size:11px;opacity:.6;margin-top:10px;display:flex;justify-content:space-between}

/* nút chung */
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.block{width:100%}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;background:var(--hero);color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.25);display:grid;place-items:center;z-index:5}
.fab svg{width:26px;height:26px}

/* thanh tab nổi */
nav.tabs{position:absolute;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--surface);border-radius:24px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.16);z-index:6}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);padding:7px 0 5px;border-radius:18px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{background:var(--hero);color:#fff}

/* bảng trượt */
.scrim{position:fixed;inset:0;background:rgba(10,8,6,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 2px;flex:none}
.sheet h3{font:800 22px/1.2 var(--f-display);margin:0;letter-spacing:-.01em}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lab{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 13px;min-width:0}
textarea.in{min-height:200px;resize:vertical;line-height:1.55}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 4px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle input{width:22px;height:22px;accent-color:var(--jade)}
.swatches{display:flex;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--bg)}
.sw.c-y{background:var(--n-y)} .sw.c-r{background:var(--n-r)} .sw.c-g{background:var(--n-g)} .sw.c-b{background:var(--n-b)} .sw.c-v{background:var(--n-v)}
.amtin{font:800 30px/1.2 var(--f-display)!important;text-align:center}

<script>
"use strict";
/* ================= LỊCH ÂM — bộ tính riêng của ứng dụng =================
   Viết mới dựa trên các công thức thiên văn đã công bố trong "Astronomical Algorithms" (Jean Meeus, 1998):
   thời điểm sóc (trăng mới, chương 49), kinh độ biểu kiến của Mặt Trời (chương 25), ΔT theo đa thức Espenak–Meeus.
   Quy tắc âm lịch Việt Nam: giờ UTC+7; tháng chứa Đông chí là tháng 11; năm có 13 tháng thì tháng nhuận là
   tháng đầu tiên sau tháng 11 không chứa trung khí (kinh độ Mặt Trời là bội số của 30°). */
const PI = Math.PI, VN_UTC = 7, DEG = PI / 180, SYNODIC = 29.530588861;
/* Số ngày Julius (JDN) của ngày dương lịch, dựa trên Date.UTC của JavaScript. */
function jdFromDate(d, m, y) { return Math.floor(Date.UTC(y, m - 1, d) / 86400000) + 2440588; }
function jdToDate(jd) { const t = new Date((jd - 2440588) * 86400000); return [t.getUTCDate(), t.getUTCMonth() + 1, t.getUTCFullYear()]; }
/* ΔT = TT − UT (giây), đa thức Espenak–Meeus. */
function deltaT(year) {
  const y = year, p = (t, c) => c.reduceRight((s, v) => s * t + v, 0);
  if (y < 1860) return p(y - 1800, [13.72, -0.332447, 0.0068612, 0.0041116, -0.00037436, 0.0000121272, -0.0000001699, 0.000000000875]);
  if (y < 1900) return p(y - 1860, [7.62, 0.5737, -0.251754, 0.01680668, -0.0004473624, 1 / 233174]);
  if (y < 1920) return p(y - 1900, [-2.79, 1.494119, -0.0598939, 0.0061966, -0.000197]);
  if (y < 1941) return p(y - 1920, [21.20, 0.84493, -0.0761, 0.0020936]);
  if (y < 1961) return p(y - 1950, [29.07, 0.407, -1 / 233, 1 / 2547]);
  if (y < 1986) return p(y - 1975, [45.45, 1.067, -1 / 260, -1 / 718]);
  if (y < 2005) return p(y - 2000, [63.86, 0.3345, -0.060374, 0.0017275, 0.000651814, 0.00002373599]);
  if (y < 2050) return p(y - 2000, [62.92, 0.32217, 0.005589]);
  const u = (y - 1820) / 100;
  return y < 2150 ? -20 + 32 * u * u - 0.5628 * (2150 - y) : -20 + 32 * u * u;
}
const ttToUt = jde => jde - deltaT(2000 + (jde - 2451545) / 365.25) / 86400;
/* Thời điểm sóc thứ k tính từ sóc 6/1/2000 (JDE, giờ TT) — Meeus chương 49. */
function newMoonJDE(k) {
  const T = k / 1236.85, T2 = T * T, T3 = T2 * T, T4 = T3 * T;
  let jde = 2451550.09766 + SYNODIC * k + 0.00015437 * T2 - 0.00000015 * T3 + 0.00000000073 * T4;
  const E = 1 - 0.002516 * T - 0.0000074 * T2;
  const M = (2.5534 + 29.1053567 * k - 0.0000014 * T2 - 0.00000011 * T3) * DEG;
  const Mp = (201.5643 + 385.81693528 * k + 0.0107582 * T2 + 0.00001238 * T3 - 0.000000058 * T4) * DEG;
  const F = (160.7108 + 390.67050284 * k - 0.0016118 * T2 - 0.00000227 * T3 + 0.000000011 * T4) * DEG;
  const Om = (124.7746 - 1.56375588 * k + 0.0020672 * T2 + 0.00000215 * T3) * DEG;
  const s = Math.sin;
  jde += -0.4072 * s(Mp) + 0.17241 * E * s(M) + 0.01608 * s(2 * Mp) + 0.01039 * s(2 * F)
    + 0.00739 * E * s(Mp - M) - 0.00514 * E * s(Mp + M) + 0.00208 * E * E * s(2 * M)
    - 0.00111 * s(Mp - 2 * F) - 0.00057 * s(Mp + 2 * F) + 0.00056 * E * s(2 * Mp + M)
    - 0.00042 * s(3 * Mp) + 0.00042 * E * s(M + 2 * F) + 0.00038 * E * s(M - 2 * F)
    - 0.00024 * E * s(2 * Mp - M) - 0.00017 * s(Om) - 0.00007 * s(Mp + 2 * M)
    + 0.00004 * s(2 * Mp - 2 * F) + 0.00004 * s(3 * M) + 0.00003 * s(Mp + M - 2 * F)
    + 0.00003 * s(2 * Mp + 2 * F) - 0.00003 * s(Mp + M + 2 * F) + 0.00003 * s(Mp - M + 2 * F)
    - 0.00002 * s(Mp - M - 2 * F) - 0.00002 * s(3 * Mp + M) + 0.00002 * s(4 * Mp);
  const A = [[0.000325, 299.77, 0.107408, -0.009173], [0.000165, 251.88, 0.016321], [0.000164, 251.83, 26.651886],
    [0.000126, 349.42, 36.412478], [0.00011, 84.66, 18.206239], [0.000062, 141.74, 53.303771], [0.00006, 207.14, 2.453732],
    [0.000056, 154.84, 7.30686], [0.000047, 34.52, 27.261239], [0.000042, 207.19, 0.121824], [0.00004, 291.34, 1.844379],
    [0.000037, 161.72, 24.198154], [0.000035, 239.56, 25.513099], [0.000023, 331.55, 3.592518]];
  for (const [c, a0, a1, a2 = 0] of A) jde += c * s((a0 + a1 * k + a2 * T2) * DEG);
  return jde;
}
/* Ngày (JDN theo giờ Việt Nam) của sóc thứ k. */
const newMoonDay = k => Math.floor(ttToUt(newMoonJDE(k)) + 0.5 + VN_UTC / 24);
/* Kinh độ biểu kiến của Mặt Trời (độ, 0–360) lúc 0 giờ (giờ Việt Nam) của ngày JDN — Meeus chương 25. */
function sunLongitudeAtDayStart(jdn) {
  const jdUT = jdn - 0.5 - VN_UTC / 24, jde = jdUT + deltaT(2000 + (jdUT - 2451545) / 365.25) / 86400;
  const T = (jde - 2451545) / 36525;
  const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  const M = (357.52911 + 35999.05029 * T - 0.0001537 * T * T) * DEG;
  const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M) + (0.019993 - 0.000101 * T) * Math.sin(2 * M) + 0.000289 * Math.sin(3 * M);
  const lambda = L0 + C - 0.00569 - 0.00478 * Math.sin((125.04 - 1934.136 * T) * DEG);
  return ((lambda % 360) + 360) % 360;
}
/* Chỉ số k của sóc rơi vào (hoặc ngay trước) ngày JDN. */
function newMoonIndexOnOrBefore(jdn) {
  let k = Math.floor((jdn - 2451550.1) / SYNODIC);
  while (newMoonDay(k + 1) <= jdn) k++;
  while (newMoonDay(k) > jdn) k--;
  return k;
}
/* Ngày Đông chí (kinh độ Mặt Trời qua 270°) của năm dương lịch y, theo giờ Việt Nam. */
function winterSolsticeDay(y) {
  for (let d = jdFromDate(18, 12, y); ; d++) if (sunLongitudeAtDayStart(d + 1) >= 270) return d;
}
/* Một "chu kỳ" gồm các tháng âm từ tháng 11 năm Y0 đến trước tháng 11 năm sau, có đánh số và tháng nhuận. */
const cycleCache = new Map();
function lunarCycle(Y0) {
  if (cycleCache.has(Y0)) return cycleCache.get(Y0);
  const k0 = newMoonIndexOnOrBefore(winterSolsticeDay(Y0)), k1 = newMoonIndexOnOrBefore(winterSolsticeDay(Y0 + 1));
  const starts = []; for (let k = k0; k <= k1; k++) starts.push(newMoonDay(k));
  const count = starts.length - 1; let leapAt = -1;
  if (count === 13) for (let i = 1; i < 13; i++) {
    if (Math.floor(sunLongitudeAtDayStart(starts[i]) / 30) === Math.floor(sunLongitudeAtDayStart(starts[i + 1]) / 30)) { leapAt = i; break; }
  }
  const months = []; let firstMonth1 = -1;
  for (let i = 0; i < count; i++) {
    const shift = leapAt >= 0 && i >= leapAt ? 1 : 0, num = ((10 + i - shift) % 12) + 1, leap = i === leapAt ? 1 : 0;
    if (num === 1 && !leap && firstMonth1 < 0) firstMonth1 = i;
    months.push({ start: starts[i], end: starts[i + 1], m: num, leap, y: 0 });
  }
  months.forEach((mo, i) => { mo.y = i < firstMonth1 ? Y0 : Y0 + 1; });
  const c = { start: starts[0], end: starts[count], months }; cycleCache.set(Y0, c); return c;
}
const lunarCache = new Map();
/* Ngày dương (JDN) → ngày âm {d, m, y, leap}. */
function lunarOfJd(jd) {
  if (lunarCache.has(jd)) return lunarCache.get(jd);
  const y = jdToDate(jd)[2]; let c = lunarCycle(y);
  if (jd < c.start) c = lunarCycle(y - 1);
  const mo = c.months.find(x => jd >= x.start && jd < x.end);
  const r = { d: jd - mo.start + 1, m: mo.m, y: mo.y, leap: mo.leap }; lunarCache.set(jd, r); return r;
}
/* Ngày âm → JDN; trả về 0 nếu tháng (nhuận) đó không có. */
function lunarToJd(ld, lm, ly, leap) {
  const c = lunarCycle(lm >= 11 ? ly : ly - 1);
  const mo = c.months.find(x => x.m === lm && x.leap === (leap ? 1 : 0) && x.y === ly);
  return mo ? mo.start + ld - 1 : 0;
}
/* Ngày âm cố định mỗi năm; tháng thiếu không có ngày 30 thì lấy ngày 29 (cách làm giỗ phổ biến). */
function lunarJdClamp(ld,lm,ly){for(let d=ld;d>=28;d--){const jd=lunarToJd(d,lm,ly,0);const b=lunarOfJd(jd);if(b.m===lm&&b.d===d&&!b.leap)return jd}return lunarToJd(Math.min(ld,28),lm,ly,0)}
function solarJdSafe(d,m,y){if(m===2&&d===29&&!(y%4===0&&(y%100!==0||y%400===0)))d=28;return jdFromDate(d,m,y)}
const CAN=["Giáp","Ất","Bính","Đinh","Mậu","Kỷ","Canh","Tân","Nhâm","Quý"],CHI=["Tý","Sửu","Dần","Mão","Thìn","Tỵ","Ngọ","Mùi","Thân","Dậu","Tuất","Hợi"];

function parseAmount(s){s=String(s).trim().toLowerCase().replace(/\s/g,"");if(!s)return 0;let mult=1;if(/(tr|m|triệu)$/.test(s)){mult=1e6;s=s.replace(/(tr|m|triệu)$/,"")}else if(/(k|ng|nghìn|ngàn)$/.test(s)){mult=1e3;s=s.replace(/(k|ng|nghìn|ngàn)$/,"")}

/* Hoa văn mặt trống đồng: ngôi sao 14 cánh, các vành tròn tiếp tuyến và vành chim Lạc cách điệu */
function drumSVG(){let s="";const pts=[];for(let i=0;i<28;i++){const r=i%2?13:44,a=i*PI/14-PI/2;pts.push((r*Math.cos(a)).toFixed(1)+","+(r*Math.sin(a)).toFixed(1))}
  s+=`<polygon points="${pts.join(" ")}" fill="currentColor"/><circle r="8" fill="currentColor"/>`;
  for(const r of[50,54,72,76,94,98])s+=`<circle r="${r}" fill="none" stroke="currentColor" stroke-width="1.3"/>`;
  for(let i=0;i<24;i++){const a=i*PI/12,x=(63*Math.cos(a)).toFixed(1),y=(63*Math.sin(a)).toFixed(1);s+=`<circle cx="${x}" cy="${y}" r="5" fill="none" stroke="currentColor" stroke-width="1.1"/><circle cx="${x}" cy="${y}" r="1.6" fill="currentColor"/>`}
  for(let i=0;i<18;i++){const a=i*PI/9;const p=(r,da)=>[(r*Math.cos(a+da)).toFixed(1),(r*Math.sin(a+da)).toFixed(1)].join(",");s+=`<path d="M${p(80,0)} L${p(88,.09)} L${p(91,.2)} L${p(86,.13)} Z" fill="currentColor"/>`}
  return s}
/* Hình mặt trăng theo ngày âm */
function moonSVG(d,size,lit="#FFE7A8",dark="rgba(0,0,0,.28)"){const p=Math.min(.999,Math.max(0,(d-1)/29.53)),a=p*2*PI,r=size/2-1,c=size/2,rx=Math.abs(r*Math.cos(a)).toFixed(2);
  const waxing=p<.5,cres=Math.cos(a)>0,ls=waxing?1:0,ts=waxing?(cres?0:1):(cres?1:0);
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="${dark}"/><path d="M${c} ${c-r} A${r} ${r} 0 0 ${ls} ${c} ${c+r} A${rx} ${r} 0 0 ${ts} ${c} ${c-r}Z" fill="${lit}"/></svg>`}

function evTitle(ev,occJd){
  const l=lunarOfJd(occJd),[,,sy]=jdToDate(occJd);const yrNow=ev.cal==="l"?l.y:sy;const n=ev.y?yrNow-ev.y:null;
  if(ev.repeat==="once")return ev.name;
  if(ev.type==="birthday")return"Sinh nhật "+ev.name+(n>0?" · "+n+" tuổi":"");
  if(ev.type==="death")return"Giỗ "+ev.name+(n>0?(n===1?" · giỗ đầu":" · giỗ lần thứ "+n):"");
  if(ev.type==="anniv")return ev.name+(n>0?" · "+n+" năm":"");
  return ev.name}
function occurrences(fromJd,toJd,opt={}){
  const S=Store.settings,out=[],y1=jdToDate(fromJd)[2]-1,y2=jdToDate(toJd)[2]+1;
  const add=(jd,o)=>{if(jd>=fromJd&&jd<=toJd)out.push({jd,...o})};
  for(let y=y1;y<=y2;y++){
    if(S.showHolidays&&!opt.noHol)for(const h of HOLIDAYS){const jd=h.k==="s"?solarJdSafe(h.d,h.m,y):lunarJdClamp(h.d,h.m,y);add(jd,{kind:"hol",title:h.t,off:!!h.off,cal:h.k})}
    for(const ev of Store.list("events")){if(ev.repeat==="once")continue;if(ev.y&&y<ev.y)continue;
      const jd=ev.cal==="l"?lunarJdClamp(ev.d,ev.m,y):solarJdSafe(ev.d,ev.m,y);add(jd,{kind:ev.type,ev,title:evTitle(ev,jd),cal:ev.cal})}
  }
  for(const ev of Store.list("events")){if(ev.repeat!=="once"||!ev.y)continue;const jd=ev.cal==="l"?lunarJdClamp(ev.d,ev.m,ev.y):jdFromDate(ev.d,ev.m,ev.y);add(jd,{kind:"once",ev,title:ev.name,cal:ev.cal})}
  if(S.monthly&&!opt.noMonthly){const skip=S.showHolidays&&!opt.noHol;for(let jd=fromJd;jd<=toJd;jd++){const l=lunarOfJd(jd);
    if(l.d===1&&!(skip&&l.m===1&&!l.leap))out.push({jd,kind:"month",title:"Mùng 1 tháng "+LMONTH[l.m]+(l.leap?" nhuận":"")});
    if(l.d===15&&!(skip&&[1,4,7,8].includes(l.m)&&!l.leap))out.push({jd,kind:"month",title:"Rằm tháng "+LMONTH[l.m]+(l.leap?" nhuận":"")})}}
  return out.sort((a,b)=>a.jd-b.jd||(a.kind==="hol")-(b.kind==="hol"))}
function nextOccurrence(ev){const t=todayJd();return occurrences(t,t+400,{noHol:1,noMonthly:1}).find(x=>x.ev&&x.ev.id===ev.id)||null}
const kindOf=o=>o.kind==="hol"?"hol":o.kind;
function kindDot(o){const k=kindOf(o);const ab=k in EV_TYPES?EV_TYPES[k].ab:KIND_AB[k];return`<span class="dot k-${k}">${esc(ab)}</span>`}

  $("#v-events").innerHTML=`<div class="view">
  <div class="chips">${[["all","Tất cả"],["birthday","Sinh nhật"],["death","Đám giỗ"],["anniv","Kỷ niệm"],["other","Khác"]].map(([k,n])=>`<button class="chip" data-evf="${k}" aria-pressed="${f===k}">${n}</button>`).join("")}</div>
  <div class="card"><div class="list">${shown.length?shown.map(({ev,next})=>{const n=next?next.jd-t:null;const k=ev.repeat==="once"?"once":ev.type;

    :`<div class="empty">Chưa có ngày nào ở mục này. Bấm nút + để thêm.</div>`}</div></div>
  <div class="sec"><h2>Ngày lễ trong năm</h2></div>

    <label class="toggle"><span>Hiện các ngày lễ, Tết Việt Nam</span><input type="checkbox" id="tgHol" ${Store.settings.showHolidays?"checked":""}></label>

  </div>`;
}

/* ---------- Chi tiêu ---------- */
function monthTotals(y,m){const pre=y+"-"+pad(m)+"-";let o=0,i=0;Store.list("txns").forEach(x=>{if(x.date.startsWith(pre)){if(x.kind==="out")o+=x.amount;else i+=x.amount}});return[o,i]}
const CAT_COLOR={"Ăn uống":1,"Đi chợ":2,"Đi lại":4,"Nhà cửa":7,"Hóa đơn":5,"Mua sắm":8,"Sức khỏe":3,"Học hành":7,"Hiếu hỷ":6,"Con cái":2,"Giải trí":4,"Khác":8};
const catColor=c=>`var(--c${CAT_COLOR[c]||8})`;
function txRow(x){return`<button class="item" data-tx="${x.id}"><span class="dot" style="background:var(--surface2);color:${x.kind==="out"?catColor(x.cat):"var(--jade)"}">${esc(x.cat.slice(0,2))}</span><div class="txt"><div class="t">${esc(x.note||x.cat)}</div><div class="s">${esc(x.cat)}</div></div><span class="amt ${x.kind==="out"?"neg":"pos"}">${x.kind==="out"?"−":"+"}${money(x.amount)}</span></button>`}
function renderMoney(){
  const Y=UI.moneyY,M=UI.moneyM,pre=Y+"-"+pad(M)+"-",tx=Store.list("txns").filter(x=>x.date.startsWith(pre)).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
  const[o,i]=monthTotals(Y,M),B=Store.settings.budget||0;
  $("#heroBody").innerHTML=`<div class="mnav"><button class="hbtn" data-mon="-1" aria-label="Tháng trước">${ICON_CHEV_L}</button><div class="t"><b>Tháng ${M}, ${Y}</b><span>${tx.length} khoản thu chi</span></div><button class="hbtn" data-mon="1" aria-label="Tháng sau">${ICON_CHEV_R}</button></div>
   <div class="hstat"><div class="ring" style="width:96px;height:96px">${ring(B?o/B:0,96,o>B&&B?"#FF8A7A":"var(--gold)","rgba(255,255,255,.14)")}<span>${B?Math.round(o/B*100)+"%":"—"}</span></div>
   <div style="min-width:0"><div class="lbl">Đã chi</div><div class="val">${money(o)}</div><div class="sub"><span>Thu <b>${moneyShort(i)}</b></span><span>Còn <b>${moneyShort(i-o)}</b></span>${B?`<span>Ngân sách <b>${moneyShort(B)}</b></span>`:""}</div></div></div>`;
  const cats={};tx.filter(x=>x.kind==="out").forEach(x=>cats[x.cat]=(cats[x.cat]||0)+x.amount);const catArr=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const days={};tx.forEach(x=>(days[x.date]=days[x.date]||[]).push(x));const dl=daysLeft(Y,M);
  $("#v-money").innerHTML=`<div class="view">
  <div class="card"><div class="sec"><h2>Ngân sách tháng</h2><button class="lnk" data-act="budget">${B?"Sửa":"Đặt ngân sách"}</button></div>
   <p class="hint" style="margin-top:4px">${B?(o>B?`<b style="color:var(--red)">Đã vượt ${money(o-B)}</b>`:`Còn ${money(B-o)}${dl?` · tiêu tối đa ${moneyShort((B-o)/dl)}/ngày trong ${dl} ngày còn lại`:""}`):"Đặt mức chi tối đa mỗi tháng để app cảnh báo khi sắp vượt."}</p></div>
  ${catArr.length?`<div class="card"><div class="sec"><h2>Chi theo nhóm</h2></div><div class="stack">${catArr.map(([c,v])=>`<i style="flex:${v};background:${catColor(c)}"></i>`).join("")}</div>${catArr.map(([c,v])=>`<div class="catrow"><i style="background:${catColor(c)}"></i><span>${esc(c)} <span class="muted small">${Math.round(v/o*100)}%</span></span><span class="amt">${money(v)}</span></div>`).join("")}</div>`:""}
  <div class="card">${tx.length?Object.keys(days).map(k=>{const jd=keyJd(k),sum=days[k].reduce((s,x)=>s+(x.kind==="out"?-x.amount:x.amount),0);return`<div class="dayhdr"><span>${WD[weekday(jd)]} ${fmtShort(jd)} · ${fmtLunar(jd)}</span><span class="num">${sum<0?"−":"+"}${money(Math.abs(sum))}</span></div><div class="list">${days[k].map(txRow).join("")}</div>`}).join(""):`<div class="empty">Chưa có khoản nào trong tháng này. Bấm + để ghi khoản đầu tiên.</div>`}</div>
  </div>`;
}
function daysLeft(Y,M){const[d,m,y]=jdToDate(todayJd());const dim=jdToDate(jdFromDate(1,M%12+1,M===12?Y+1:Y)-1)[0];if(y===Y&&m===M)return dim-d+1;if(Y*12+M<y*12+m)return 0;return dim}

/* ---------- Ghi chú ---------- */
function noteCard(n){const d=new Date(n.updated);return`<button class="note ${n.color?"c-"+n.color:""}" data-note="${n.id}">${n.title?`<div class="t">${esc(n.title)}</div>`:""}<div class="b">${esc(n.body)}</div><div class="d"><span>${pad(d.getDate())}/${pad(d.getMonth()+1)} · ${pad(d.getHours())}:${pad(d.getMinutes())}</span><span>${n.pinned?"Đã ghim":""}</span></div></button>`}
function renderNotes(){
  const q=UI.noteQ.trim().toLowerCase(),all=Store.list("notes");
  const notes=all.filter(n=>!q||((n.title||"")+" "+(n.body||"")).toLowerCase().includes(q)).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||b.updated-a.updated);
  if(!$("#noteQ")){$("#heroBody").innerHTML=`<div style="font-size:13px;color:var(--hero-muted)" id="noteCount"></div><input class="hsearch" id="noteQ" type="search" placeholder="Tìm trong ghi chú…" aria-label="Tìm ghi chú" value="${esc(UI.noteQ)}">`;
    $("#noteQ").addEventListener("input",e=>{UI.noteQ=e.target.value;renderNotes()})}
  $("#noteCount").textContent=all.length?all.length+" ghi chú":"Danh sách đi chợ, việc cần làm, số điện thoại…";
  $("#v-notes").innerHTML=`<div class="view">${notes.length?`<div class="notes">${notes.map(noteCard).join("")}</div>`:`<div class="empty">${q?"Không tìm thấy ghi chú phù hợp.":"Chưa có ghi chú. Bấm + để viết ghi chú đầu tiên."}</div>`}</div>`;
}

/* ================= BẢNG NHẬP (sheet) ================= */
function openSheet(html,onMount){const s=$("#sheet");s._onClose=null;s.innerHTML=`<div class="grab"></div>`+html;$("#scrim").hidden=false;onMount&&onMount(s)}
function closeSheet(){const s=$("#sheet");if(s._onClose){const f=s._onClose;s._onClose=null;f()}$("#scrim").hidden=true;s.innerHTML=""}
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#scrim").hidden)closeSheet()});
function segHTML(id,opts,val){return`<div class="seg" id="${id}">${opts.map(([k,n])=>`<button type="button" data-v="${k}" aria-pressed="${k===val}">${n}</button>`).join("")}</div>`}
function segVal(root,id){return root.querySelector("#"+id+" [aria-pressed=true]").dataset.v}
function wireSegs(root,cb){root.querySelectorAll(".seg").forEach(s=>s.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;s.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));cb&&cb(s.id,b.dataset.v)}))}
function confirmBtn(btn,fn){btn.addEventListener("click",()=>{if(btn.dataset.armed){fn()}else{btn.dataset.armed=1;btn.textContent="Bấm lần nữa để xóa";setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent="Xóa"}},3000)}})}

function quickAddSheet(){openSheet(`<h3>Thêm mới</h3><div class="qadd">
  <button class="qa" data-act="addTxn"><i class="k-anniv">${ICON_WALLET}</i>Chi tiêu</button>
  <button class="qa" data-act="addEvent"><i class="k-death">${ICON_BELL}</i>Ngày nhớ</button>
  <button class="qa" data-act="addNote"><i class="k-birthday">${ICON_NOTE}</i>Ghi chú</button></div>`)}

function eventSheet(ev,presetJd,presetType){
  const isNew=!ev;let e=ev||{id:uid(),name:"",type:presetType||"birthday",cal:"s",d:"",m:"",y:"",repeat:"year",remind:3,note:""};
  if(isNew&&e.type==="death")e.cal="l";
  if(isNew&&presetJd){const[d,m,y]=jdToDate(presetJd);if(e.cal==="l"){const l=lunarOfJd(presetJd);e={...e,d:l.d,m:l.m}}else e={...e,d,m};if(e.type!=="birthday")e.y=y}
  openSheet(`<h3>${isNew?"Thêm ngày nhớ":"Sửa ngày nhớ"}</h3>
  <form id="evForm" style="display:flex;flex-direction:column;gap:14px">
   <div class="field"><span class="lab">Loại</span>${segHTML("evType",[["birthday","Sinh nhật"],["death","Đám giỗ"],["anniv","Kỷ niệm"],["other","Khác"]],e.type)}</div>
   <div class="field"><label for="evName">Tên người / sự kiện</label><input class="in" id="evName" required value="${esc(e.name)}" placeholder="Ví dụ: Mẹ, Ông nội, Ngày cưới"></div>
   <div class="field"><span class="lab">Theo lịch</span>${segHTML("evCal",[["s","Dương lịch"],["l","Âm lịch"]],e.cal)}</div>
   <div class="row3"><div class="field"><label for="evD">Ngày</label><input class="in num" id="evD" inputmode="numeric" required value="${e.d}"></div><div class="field"><label for="evM">Tháng</label><input class="in num" id="evM" inputmode="numeric" required value="${e.m}"></div><div class="field"><label for="evY" id="evYL">Năm</label><input class="in num" id="evY" inputmode="numeric" value="${e.y||""}" placeholder="tùy chọn"></div></div>
   <div class="card" id="evPreview" style="padding:12px 14px;font-size:14px" hidden></div>
   <div class="field"><span class="lab">Lặp lại</span>${segHTML("evRep",[["year","Hằng năm"],["once","Một lần"]],e.repeat)}</div>
   <div class="field"><label for="evRem">Nhắc trước</label><select class="in" id="evRem">${[0,1,2,3,5,7,10,14,30].map(n=>`<option value="${n}" ${n==(e.remind??3)?"selected":""}>${n?n+" ngày":"Đúng ngày"}</option>`).join("")}</select></div>
   <div class="field"><label for="evNote">Ghi chú</label><input class="in" id="evNote" value="${esc(e.note||"")}" placeholder="Ví dụ: chuẩn bị mâm cỗ, mua quà"></div>
   <div class="actions"><button class="btn red" type="submit">Lưu</button>${isNew?"":`<button class="btn danger" type="button" id="evDel">Xóa</button>`}</div>
  </form>`,root=>{
    const upd=()=>{const t=segVal(root,"evType"),cal=segVal(root,"evCal"),rep=segVal(root,"evRep"),d=+root.querySelector("#evD").value,m=+root.querySelector("#evM").value,y=+root.querySelector("#evY").value;
      root.querySelector("#evYL").textContent=rep==="once"?"Năm":t==="birthday"?"Năm sinh":t==="death"?"Năm mất":"Năm bắt đầu";
      root.querySelector("#evY").placeholder=rep==="once"?"bắt buộc":"tùy chọn";
      const p=root.querySelector("#evPreview");p.hidden=true;if(!d||!m||m>12||d>(cal==="l"?30:31))return;
      const tmp={...e,type:t,cal,d,m,y:y||"",repeat:rep,id:"__tmp"};const tj=todayJd();let jd;
      if(rep==="once"){if(!y)return;jd=cal==="l"?lunarJdClamp(d,m,y):jdFromDate(d,m,y)}
      else{for(let yy=jdToDate(tj)[2]-1;yy<=jdToDate(tj)[2]+1;yy++){const j=cal==="l"?lunarJdClamp(d,m,yy):solarJdSafe(d,m,yy);if(j>=tj){jd=j;break}}}
      if(!jd)return;p.hidden=false;
      p.innerHTML=`<b>${esc(evTitle(tmp,jd))}</b><br><span class="muted">Lần tới: ${WD[weekday(jd)]}, ${fmtDate(jd)} (${fmtLunar(jd)}) · ${jd>=tj?relDays(jd-tj).toLowerCase():"đã qua"}</span>`};
    wireSegs(root,(id,v)=>{if(id==="evType"&&v==="death"&&isNew)root.querySelector("#evCal [data-v=l]").click();upd()});
    root.querySelectorAll("input").forEach(i=>i.addEventListener("input",upd));upd();
    root.querySelector("#evForm").addEventListener("submit",ev2=>{ev2.preventDefault();
      const cal=segVal(root,"evCal"),rep=segVal(root,"evRep"),d=+root.querySelector("#evD").value,m=+root.querySelector("#evM").value,yv=root.querySelector("#evY").value.trim(),y=yv?+yv:"";
      if(!d||!m||m<1||m>12||d<1||d>(cal==="l"?30:31)){toast("Ngày hoặc tháng chưa đúng.");return}
      if(rep==="once"&&!y){toast("Sự kiện một lần cần nhập năm.");return}
      if(y&&(y<1800||y>2199)){toast("Năm phải trong khoảng 1800–2199.");return}
      Store.put("events",{id:e.id,name:root.querySelector("#evName").value.trim()||"Không tên",type:segVal(root,"evType"),cal,d,m,y,repeat:rep,remind:+root.querySelector("#evRem").value,note:root.querySelector("#evNote").value.trim(),created:e.created||Date.now()});
      closeSheet();toast(isNew?"Đã thêm ngày nhớ":"Đã lưu")});
    const del=root.querySelector("#evDel");if(del)confirmBtn(del,()=>{Store.del("events",e.id);closeSheet();toast("Đã xóa")});
  });
}

function txnSheet(x,presetJd){
  const isNew=!x;const t=x||{id:uid(),kind:"out",amount:"",cat:"Ăn uống",note:"",date:jdKey(presetJd||todayJd())};
  const catsHTML=k=>(k==="out"?CATS_OUT:CATS_IN).map(c=>`<button type="button" class="chip" data-cat="${esc(c)}" aria-pressed="${c===t.cat}">${esc(c)}</button>`).join("");
  openSheet(`<h3>${isNew?"Ghi thu chi":"Sửa khoản"}</h3>
  <form id="txForm" style="display:flex;flex-direction:column;gap:14px">
    ${segHTML("txKind",[["out","Khoản chi"],["in","Khoản thu"]],t.kind)}
    <div class="field"><input class="in num amtin" id="txAmt" inputmode="decimal" required value="${t.amount||""}" placeholder="0" aria-label="Số tiền"><span class="hint" id="txAmtV" style="text-align:center">Gõ 50k, 1.5tr hoặc 200000</span></div>
    <div class="chips" id="txQuick" style="justify-content:center">${["20k","50k","100k","200k","500k","1tr"].map(v=>`<button type="button" class="chip" data-q="${v}">${v}</button>`).join("")}</div>
    <div class="field"><span class="lab">Nhóm</span><div class="chips" id="txCats">${catsHTML(t.kind)}</div></div>
    <div class="field"><label for="txNote">Nội dung</label><input class="in" id="txNote" value="${esc(t.note)}" placeholder="Ví dụ: Phở sáng, tiền điện tháng 9"></div>
    <div class="field"><label for="txDate">Ngày</label><input class="in" type="date" id="txDate" value="${t.date}"></div>
    <div class="actions"><button class="btn red" type="submit">Lưu</button>${isNew?"":`<button class="btn danger" type="button" id="txDel">Xóa</button>`}</div>
  </form>`,root=>{
    let cat=t.cat;const amt=root.querySelector("#txAmt"),showV=()=>{const v=parseAmount(amt.value);root.querySelector("#txAmtV").textContent=v?money(v):"Gõ 50k, 1.5tr hoặc 200000"};
    amt.addEventListener("input",showV);showV();
    root.querySelector("#txQuick").addEventListener("click",e=>{const b=e.target.closest("[data-q]");if(b){amt.value=b.dataset.q;showV()}});
    root.querySelector("#txCats").onclick=e=>{const b=e.target.closest("[data-cat]");if(!b)return;cat=b.dataset.cat;root.querySelectorAll("#txCats .chip").forEach(c=>c.setAttribute("aria-pressed",c===b))};
    wireSegs(root,(id,v)=>{const list=v==="out"?CATS_OUT:CATS_IN;if(!list.includes(cat))cat=list[0];t.cat=cat;root.querySelector("#txCats").innerHTML=catsHTML(v)});
    root.querySelector("#txForm").addEventListener("submit",e=>{e.preventDefault();const v=parseAmount(amt.value);if(!v||v<0){toast("Nhập số tiền, ví dụ 50k hoặc 1.5tr.");return}
      const date=root.querySelector("#txDate").value||jdKey(todayJd());
      Store.put("txns",{id:t.id,kind:segVal(root,"txKind"),amount:v,cat,note:root.querySelector("#txNote").value.trim(),date,created:t.created||Date.now()});
      closeSheet();toast("Đã ghi "+money(v));
      const[y,m]=date.split("-").map(Number);if(UI.tab==="money"){UI.moneyY=y;UI.moneyM=m}
      const B=Store.settings.budget;if(B){const[o]=monthTotals(y,m);if(o>B)setTimeout(()=>toast("Chú ý: đã vượt ngân sách tháng "+money(o-B)),1400);else if(o>B*.9)setTimeout(()=>toast("Đã dùng hơn 90% ngân sách tháng"),1400)}});
    const del=root.querySelector("#txDel");if(del)confirmBtn(del,()=>{Store.del("txns",t.id);closeSheet();toast("Đã xóa")});
    if(isNew)setTimeout(()=>amt.focus(),60);
  });
}

function noteSheet(n){

    <div class="field"><span class="lab">Màu giấy</span><div class="swatches" id="ntColor">${["","y","r","g","b","v"].map(c=>`<button type="button" class="sw ${c?"c-"+c:""}" data-c="${c}" aria-pressed="${c===color}" aria-label="Màu ${c||"trắng"}"></button>`).join("")}</div></div>
    <div class="actions"><button class="btn red" id="ntDone">Xong</button>${isNew?"":`<button class="btn danger" id="ntDel">Xóa</button>`}</div>`,root=>{

    root.querySelector("#ntColor").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(!b)return;color=b.dataset.c;root.querySelectorAll("#ntColor .sw").forEach(x=>x.setAttribute("aria-pressed",x===b))});
    root.querySelector("#ntDone").addEventListener("click",closeSheet);
    const del=root.querySelector("#ntDel");if(del)confirmBtn(del,()=>{deleted=true;Store.del("notes",note.id);closeSheet();toast("Đã xóa ghi chú")});
    root._onClose=()=>{if(deleted)return;const title=root.querySelector("#ntTitle").value.trim(),body=root.querySelector("#ntBody").value;
      if(!title&&!body.trim()){if(!isNew)Store.del("notes",note.id);return}
      if(isNew||title!==note.title||body!==note.body||pinned!==!!note.pinned||color!==(note.color||""))Store.put("notes",{id:note.id,title,body,pinned,color,updated:Date.now()})};
    if(isNew)setTimeout(()=>root.querySelector("#ntBody").focus(),60);
  });
}

function budgetSheet(){openSheet(`<h3>Ngân sách tháng</h3><div class="field"><label for="bdV">Mức chi tối đa mỗi tháng</label><input class="in num amtin" id="bdV" inputmode="decimal" value="${Store.settings.budget||""}" placeholder="Ví dụ: 8tr"><span class="hint" id="bdH" style="text-align:center"></span></div><div class="actions"><button class="btn red" id="bdSave">Lưu</button><button class="btn ghost" id="bdOff">Bỏ ngân sách</button></div>`,root=>{

/* ================= SAO LƯU, XUẤT LỊCH, CẦU NỐI ANDROID ================= */
async function offerFile(filename,text,mime){
  if(NATIVE&&NATIVE.saveFile){try{const r=NATIVE.saveFile(filename,text,mime);toast(r||"Đã lưu "+filename);return true}catch(e){return false}}
  if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads");if(dl){try{await dl.save({filename,data:text});return true}catch(e){if(e&&e.code==="declined")return true}}return false}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return true}catch(e){return false}}
function buildICS(){
  const t=todayJd(),occ=occurrences(t,t+365*5,{noMonthly:1,noHol:!Store.settings.showHolidays});
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const fold=s=>s.replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//SoTayLichViet//VI","CALSCALE:GREGORIAN","X-WR-CALNAME:Sổ Tay Lịch Việt"];
  occ.forEach((o,i)=>{const[d,m,y]=jdToDate(o.jd),[d2,m2,y2]=jdToDate(o.jd+1);const rem=o.ev?(o.ev.remind||0):0;
    L.push("BEGIN:VEVENT","UID:"+(o.ev?o.ev.id:"hol"+i)+"-"+o.jd+"@sotay","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+y+pad(m)+pad(d),"DTEND;VALUE=DATE:"+y2+pad(m2)+pad(d2),
      "SUMMARY:"+fold(o.title),"DESCRIPTION:"+fold(fmtLunar(o.jd)+" · "+canChiYear(lunarOfJd(o.jd).y)+(o.ev&&o.ev.note?"\n"+o.ev.note:"")));
    if(o.ev){const al=tr=>L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+fold(o.title),"TRIGGER:"+tr,"END:VALARM");al("PT8H");if(rem)al("-PT"+(rem*24-8)+"H")}
    L.push("END:VEVENT")});
  L.push("END:VCALENDAR");return{text:L.join("\r\n"),count:occ.length}}
async function exportICS(){const{text,count}=buildICS();
  if(!count){toast("Chưa có ngày nào để xuất.");return}
  const ok=await offerFile("so-tay-lich-viet.ics",text,"text/calendar");
  if(!ok)openSheet(`<h3>Xuất sang Lịch điện thoại</h3><p class="hint">Trong khung xem này không tải được tệp lịch (.ics). Hãy cài bản APK để có thông báo tự động, hoặc sao chép nội dung dưới đây, lưu thành tệp <b>so-tay.ics</b> rồi mở bằng ứng dụng Lịch.</p><textarea class="in" readonly id="icsTxt" style="min-height:160px;font-size:12px">${esc(text)}</textarea><button class="btn" id="icsCopy">Sao chép</button>`,root=>{root.querySelector("#icsCopy").onclick=()=>copyText(root.querySelector("#icsTxt"))});
  else if(!NATIVE)toast("Đã tạo "+count+" mục lịch cho 5 năm tới")}
function copyText(ta){const sel=()=>{ta.select();toast("Hãy bấm giữ để sao chép")};if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(()=>toast("Đã sao chép"),sel);else sel()}
function backupJSON(){return JSON.stringify({app:"so-tay-lich-viet",version:1,exported:new Date().toISOString(),settings:Store.settings,data:Store.data},null,1)}
function importJSON(text){let o;try{o=JSON.parse(text)}catch(e){toast("Tệp sao lưu không đọc được.");return}
  if(!o||!o.data){toast("Tệp không phải bản sao lưu của Sổ Tay.");return}let n=0;
  for(const kind of["notes","events","txns"])for(const it of Object.values(o.data[kind]||{})){if(it&&it.id){Store.put(kind,it);n++}}
  if(o.settings)Store.setSettings(o.settings);toast("Đã nhập "+n+" mục");closeSheet()}
/* Lịch thông báo cho bản Android: danh sách lời nhắc theo ngày trong 400 ngày tới */
function reminderList(){const t=todayJd(),out=[];
  for(const o of occurrences(t,t+400)){const lun=o.kind!=="month"?" ("+fmtLunar(o.jd)+")":"";
    if(o.ev){const rem=o.ev.remind||0,txt=WD[weekday(o.jd)]+", "+fmtDate(o.jd)+lun+(o.ev.note?" · "+o.ev.note:"");out.push({date:jdKey(o.jd),title:"Hôm nay: "+o.title,text:txt});
      if(rem&&o.jd-rem>=t)out.push({date:jdKey(o.jd-rem),title:"Còn "+rem+" ngày: "+o.title,text:txt})}
    else if(o.kind==="hol")out.push({date:jdKey(o.jd),title:o.title,text:"Hôm nay, "+fmtDate(o.jd)+lun});
    else if(o.kind==="month")out.push({date:jdKey(o.jd),title:"Hôm nay là "+o.title.replace("Mùng","mùng").replace("Rằm","rằm")+" âm lịch",text:"Ngày "+canChiDay(o.jd)+" · nhớ thắp hương"})}
  return out}
let lastSync="";
function syncNative(){if(!NATIVE)return;try{
  const color=getComputedStyle($("#app")).getPropertyValue("--hero").trim();if(NATIVE.setBarColor&&color)NATIVE.setBarColor(color);const bg=getComputedStyle(document.body).backgroundColor;if(NATIVE.setNavColor&&bg)NATIVE.setNavColor(bg);
  const json=JSON.stringify(reminderList()),key=json+"|"+Store.settings.notifyHour;if(key!==lastSync&&NATIVE.setReminders){lastSync=key;NATIVE.setReminders(json,Store.settings.notifyHour|0)}}catch(e){}}

    const ts=root.querySelector("#sTest");if(ts)ts.onclick=()=>{try{NATIVE.testNotify()}catch(e){}};
    root.querySelector("#bkOut").onclick=async()=>{const txt=backupJSON(),d=new Date();const ok=await offerFile(`so-tay-sao-luu-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`,txt,"application/json");
      if(!ok){root.querySelector("#bkArea").innerHTML=`<textarea class="in" readonly id="bkTxt" style="min-height:120px;font-size:12px">${esc(txt)}</textarea><button class="btn block" id="bkCopy" style="margin-top:8px">Sao chép</button>`;root.querySelector("#bkCopy").onclick=()=>copyText(root.querySelector("#bkTxt"))}};

/* ================= SỰ KIỆN CHUNG ================= */
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");
  if(a){const act=a.dataset.act,jd=a.dataset.jd?+a.dataset.jd:null;
    if(["addEvent","addTxn","addNote"].includes(act)&&!$("#scrim").hidden)closeSheet();
    if(act==="addEvent")eventSheet(null,jd,a.dataset.type);else if(act==="addTxn")txnSheet(null,jd);else if(act==="addNote")noteSheet(null);
    else if(act==="budget")budgetSheet();else if(act==="ics")exportICS();return}
  const g=e.target.closest("[data-go]");if(g){goTab(g.dataset.go);return}
  const ev=e.target.closest("[data-ev]");if(ev){const x=Store.data.events[ev.dataset.ev];if(x)eventSheet(x);return}
  const tx=e.target.closest("[data-tx]");if(tx){const x=Store.data.txns[tx.dataset.tx];if(x)txnSheet(x);return}
  const nt=e.target.closest("[data-note]");if(nt){const x=Store.data.notes[nt.dataset.note];if(x)noteSheet(x);return}
  const dd=e.target.closest("[data-day]");if(dd){const jd=+dd.dataset.day,[,m,y]=jdToDate(jd);UI.selJd=jd;UI.calM=m;UI.calY=y;goTab("cal");return}
  const day=e.target.closest("[data-jd]");if(day&&day.classList.contains("day")){const jd=+day.dataset.jd,[,m,y]=jdToDate(jd);UI.selJd=jd;if(m!==UI.calM){UI.calM=m;UI.calY=y}renderCal();return}
  const c=e.target.closest("[data-cal]");if(c){const v=c.dataset.cal;if(v==="today"){const t=todayJd(),[,m,y]=jdToDate(t);UI.calM=m;UI.calY=y;UI.selJd=t}else shiftCal(+v);renderCal();return}
  const mo=e.target.closest("[data-mon]");if(mo){let m=UI.moneyM+ +mo.dataset.mon,y=UI.moneyY;if(m<1){m=12;y--}if(m>12){m=1;y++}UI.moneyM=m;UI.moneyY=y;renderMoney();return}
  const f=e.target.closest("[data-evf]");if(f){UI.evFilter=f.dataset.evf;renderEvents();return}
  const cv=e.target.closest("[data-conv]");if(cv){UI.conv=cv.dataset.conv;renderCal();return}
